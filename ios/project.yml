name: FireLink
options:
  bundleIdPrefix: cn.firelink
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: FireLink
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to FireLink to load tasks and submit applications.
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  FireLink:
    type: application
    platform: iOS
    sources:
      - FireLink
      - path: ../shared/regions.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.firelink.volunteer
        INFOPLIST_FILE: FireLink/Info.plist
        CODE_SIGN_ENTITLEMENTS: FireLink/FireLink.entitlements
  FireLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FireLinkTests
      - path: ../fixtures/application-results.json
        buildPhase: resources
      - path: ../fixtures/incident-sorting.json
        buildPhase: resources
    dependencies:
      - target: FireLink
  FireLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FireLinkUITests]
    dependencies:
      - target: FireLink
schemes:
  FireLink:
    build:
      targets:
        FireLink: all
    test:
      targets: [FireLinkTests]
  FireLinkUI:
    build:
      targets:
        FireLink: all
    test:
      targets: [FireLinkUITests]
