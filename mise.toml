#:schema https://mise.jdx.dev/schema/mise.json

[settings]
lockfile = true

[tasks."server:dev"]
run = "mise -C server run dev"

[tasks."server:test"]
run = "mise -C server run test"

[tasks."organizer:dev"]
description = "构建组织者工作台并启动本地 Worker"
run = "mise -C server run dev"

[tasks."organizer:build"]
run = "mise -C server exec -- bun run --cwd ../organizer build"

[tasks."android:build"]
run = "mise -C android run build"

[tasks."ios:build"]
run = "mise -C apple run build"

[tasks."apple:build"]
description = "构建 iPhone、iPad、Mac 和 Apple Vision Pro 志愿者客户端"
run = "mise -C apple run build:all"

[tasks."macos:build"]
run = "mise -C apple run build:mac"

[tasks."visionos:build"]
run = "mise -C apple run build:vision"

[tasks."presentation:install"]
description = "使用 Bun 安装开题汇报及其后端依赖"
run = ["mise -C server run install", "mise -C server exec -- bun install --cwd ../presentation/proposal --frozen-lockfile"]

[tasks."presentation:proposal"]
description = "启动开题汇报、本地演示后端和专用 AVD"
run = "mise -C server exec -- bun run --cwd ../presentation proposal"
raw = true

[tasks."presentation:final"]
description = "启动结题汇报静态预览"
run = "mise -C server exec -- bun run --cwd ../presentation final"
raw = true

[tasks."presentation:build"]
description = "重建结题汇报与演讲稿 HTML"
run = "mise -C server exec -- bun run --cwd ../presentation final:build"

[tasks."presentation:deploy"]
description = "随现有站点发布 /pre/proposal 与 /pre/final"
run = "mise -C server run deploy"

[tasks."presentation:screenshots"]
description = "启动开题客户端并更新全部演示截图"
run = "mise -C server exec -- bun run --cwd ../presentation screenshots:update"
raw = true

[tasks.check]
description = "检查组织者工作台、后端、演示程序和各客户端（完整检查需要 macOS、Xcode 和 Android SDK）"
depends = ["check:whitespace", "check:organizer", "check:server", "check:presentation", "check:android", "check:apple"]

[tasks."check:organizer"]
description = "组织者网页 TypeScript 检查和生产构建"
run = ["mise -C server exec -- bun run --cwd ../organizer check", "mise -C server exec -- bun run --cwd ../organizer build"]

[tasks."check:whitespace"]
description = "检查工作区及暂存区的空白错误"
run = ["git diff --check", "git diff --cached --check"]

[tasks."check:server"]
description = "后端生成类型、TypeScript、格式和 API 测试"
run = ["mise -C server run check", "mise -C server run test"]

[tasks."check:presentation"]
description = "使用项目固定的 Bun 版本运行演示程序类型检查和测试"
run = ["mise -C server exec -- bun run --cwd ../presentation check", "mise -C server exec -- bun run --cwd ../presentation test"]

[tasks."check:android"]
description = "Android 单元测试和 lint"
run = "mise -C android run test"

[tasks."check:ios"]
description = "iOS 模拟器构建和单元测试"
run = ["mise -C apple run build", "mise -C apple run test"]

[tasks."check:macos"]
description = "原生 Mac 客户端构建和共享单元测试"
run = "mise -C apple run test:mac"

[tasks."check:apple"]
description = "Apple 客户端构建与共享测试，统一生成 Xcode 工程"
run = "mise -C apple run check"

[tasks."check:visionos"]
description = "原生 Vision Pro 客户端构建（不需要模拟器运行时）"
run = "mise -C apple run build:vision"
