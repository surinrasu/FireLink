name: Presentation screenshots

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.3.13
          working_directory: server
          install: false
      - name: Install toolchains and locked dependencies
        run: |
          mise -C server install
          mise -C android install
          mise -C server exec -- npm --prefix ../presentation ci
      - name: Enable Android hardware acceleration
        # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK components
        run: |
          mise -C android exec -- "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" \
            "system-images;android-35;google_apis;x86_64"
      - name: Capture every scene in both themes
        run: mise -C server exec -- npm --prefix ../presentation run screenshots:update
      - name: Show emulator diagnostics on failure
        if: failure()
        run: tail -n 100 presentation/.artifacts/emulator.log || true
      - name: Commit updated screenshots
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git add -- presentation/public/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
            exit 0
          fi
          # Never publish captures of an older revision over newer source changes.
          remote_sha=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "Branch advanced; the newer run will update its screenshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh presentation screenshots"
          # GITHUB_TOKEN pushes do not trigger another workflow run.
          # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
